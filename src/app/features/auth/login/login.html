<div class="login-page">

  <div class="login-card">

    <div class="login-logo">
      E
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Sign in to your EstateHub account
    </p>


    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />

      </div>


      @if (errorMessage) {
        <p class="error-message">
          {{ errorMessage }}
        </p>
      }


      <div class="form-options">

        <label class="remember">

          <input
            type="checkbox"
          />

          <span>Remember me</span>

        </label>


        <a href="#">
          Forgot Password?
        </a>

      </div>


      <button
        type="submit"
        class="login-btn">

        Sign In

      </button>

    </form>


    <div class="divider">
      <span>OR</span>
    </div>


    <p class="register-text">

      Don't have an account?

      <a routerLink="/register">
        Create Account
      </a>

    </p>

  </div>

</div>
